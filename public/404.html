<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Page Not Found</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=IBM+Plex+Mono:wght@400&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet" />
    <style>
      :root {
        --paper: #F0F2F5;
        --ink: #1A2332;
        --ink-soft: #5A6577;
        --accent-olive: #3B6CB4;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --paper: #0F1219;
          --ink: #E2E6EB;
          --ink-soft: #7A8599;
          --accent-olive: #5B9BF5;
        }
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: 'IBM Plex Sans', sans-serif;
        background: var(--paper);
        color: var(--ink);
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
      }
      .container { max-width: 420px; padding: 24px; }
      .code {
        font-family: 'Fraunces', Georgia, serif;
        font-size: clamp(4rem, 12vw, 8rem);
        font-weight: 600;
        line-height: 1;
        margin-bottom: 16px;
        color: var(--accent-olive);
      }
      .message {
        font-family: 'IBM Plex Mono', monospace;
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: var(--ink-soft);
        margin-bottom: 40px;
      }
      a {
        display: inline-block;
        padding: 10px 28px;
        border: 1px solid var(--ink);
        background: var(--ink);
        color: var(--paper);
        font-family: 'IBM Plex Mono', monospace;
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        text-decoration: none;
        transition: background 0.15s, color 0.15s;
      }
      a:hover { background: transparent; color: var(--ink); }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="code">404</div>
      <p class="message">Page not found</p>
      <a href="/Portfolio/">Back to home</a>
    </div>
  </body>
</html>
